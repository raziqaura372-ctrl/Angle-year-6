services:
  postgres:
    image: postgres:15-alpine
    container_name: veridraft_postgres
    environment:
      POSTGRES_DB: veridraft
      POSTGRES_USER: veridraft
      POSTGRES_PASSWORD: veridraft_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridraft"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: veridraft_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: veridraft_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://veridraft:veridraft_password@postgres:5432/veridraft
      - SYNC_DATABASE_URL=postgresql://veridraft:veridraft_password@postgres:5432/veridraft
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_SQLITE_FALLBACK=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: veridraft_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://veridraft:veridraft_password@postgres:5432/veridraft
      - SYNC_DATABASE_URL=postgresql://veridraft:veridraft_password@postgres:5432/veridraft
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_SQLITE_FALLBACK=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: veridraft_frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
